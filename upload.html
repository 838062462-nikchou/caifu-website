<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据上传 - 财赋网</title>
<style>
body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; padding: 0; background: #f5f7fa; }
.box { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px 24px; border-radius: 12px; }
h1 { color: #1e88e5; font-size: 22px; margin: 0 0 8px; }
.sub { color: #888; font-size: 13px; margin: 0 0 24px; }
.area { border: 2px dashed #ccc; border-radius: 8px; padding: 30px 20px; text-align: center; background: #fafafa; cursor: pointer; }
.area:hover { border-color: #1e88e5; background: #e3f2fd; }
.area input { display: none; }
.ico { font-size: 40px; margin-bottom: 8px; }
.txt { font-size: 14px; color: #666; }
.hint { font-size: 11px; color: #aaa; margin-top: 6px; }
.btn { background: #1e88e5; color: #fff; padding: 12px 32px; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; margin-top: 20px; width: 100%; }
.btn:disabled { background: #ccc; }
.bar { height: 6px; background: #e8eef4; border-radius: 3px; margin-top: 12px; overflow: hidden; display: none; }
.fill { height: 100%; background: #1e88e5; width: 0%; transition: width 0.2s; }
.msg { margin-top: 16px; padding: 12px; border-radius: 6px; font-size: 14px; display: none; word-break: break-all; }
.ok { background: #e8f5e9; color: #1b5e20; }
.err { background: #ffebee; color: #b71c1c; }
.info { background: #f5f7fa; padding: 14px; border-radius: 6px; margin-top: 24px; font-size: 12px; color: #666; line-height: 1.7; }
.fname { font-size: 12px; color: #666; margin-top: 8px; word-break: break-all; }
</style>
</head>
<body>
<div class="box">
<h1>📤 数据上传</h1>
<p class="sub">财赋网每日报告 · 服务器自动处理</p>

<label class="area" id="area">
<input type="file" id="file" accept=".xlsx,.xls">
<div class="ico">📊</div>
<div class="txt">点击或拖拽 xlsx 文件</div>
<div class="hint">支持 .xlsx / .xls · 不限大小</div>
</label>

<div class="fname" id="fname"></div>

<div class="bar" id="bar"><div class="fill" id="fill"></div></div>

<button class="btn" id="btn" disabled>上传文件</button>

<div class="msg" id="msg"></div>

<div class="info">
<b style="color:#1e88a8;">📌 使用说明：</b><br>
1. 选择 xlsx 文件<br>
2. 点击「上传文件」<br>
3. 服务器自动压缩 + 生成报告<br>
4. 永久报告地址：<br>
<span style="color:#1e88e5;">838062462-nikchou.github.io/caifu-website/daily-report.html</span>
</div>
</div>

<script>
(function() {
  var area = document.getElementById("area");
  var file = document.getElementById("file");
  var btn = document.getElementById("btn");
  var bar = document.getElementById("bar");
  var fill = document.getElementById("fill");
  var msg = document.getElementById("msg");
  var fn = document.getElementById("fname");
  var cur = null;

  function onFile(f) {
    cur = f;
    fn.textContent = "已选择: " + f.name + " (" + (f.size/1024/1024).toFixed(2) + " MB)";
    btn.disabled = false;
    btn.textContent = "上传文件";
    hideMsg();
  }

  area.addEventListener("dragover", function(e) {
    e.preventDefault();
    area.style.borderColor = "#1e88e5";
  });
  area.addEventListener("dragleave", function() {
    area.style.borderColor = "#ccc";
  });
  area.addEventListener("drop", function(e) {
    e.preventDefault();
    area.style.borderColor = "#ccc";
    if (e.dataTransfer.files.length > 0) {
      onFile(e.dataTransfer.files[0]);
    }
  });
  file.addEventListener("change", function() {
    if (file.files.length > 0) onFile(file.files[0]);
  });

  btn.addEventListener("click", function() {
    if (!cur) return;
    btn.disabled = true;
    btn.textContent = "上传中...";
    bar.style.display = "block";
    fill.style.width = "0%";

    var fd = new FormData();
    fd.append("file", cur);

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/upload");

    xhr.upload.onprogress = function(e) {
      if (e.lengthComputable) {
        var pct = Math.round(e.loaded / e.total * 100);
        fill.style.width = pct + "%";
      }
    };

    xhr.onload = function() {
      bar.style.display = "none";
      btn.disabled = false;
      btn.textContent = "重新上传";

      if (xhr.status === 200) {
        try {
          var r = JSON.parse(xhr.responseText);
          if (r.success) {
            showMsg("ok", "✅ 上传成功！<br>" +
              "📦 文件: " + r.filename + "<br>" +
              "📊 大小: " + (r.size_kb/1024).toFixed(2) + " MB<br>" +
              "💾 " + (r.compression || "") + "<br>" +
              "📋 报告: " + (r.report_summary || "生成中...") + "<br>" +
              "🔗 <a href='" + r.report_url + "' target='_blank'>查看完整报告</a>");
          } else {
            showMsg("err", "❌ 失败: " + r.error);
          }
        } catch (err) {
          showMsg("err", "❌ 响应解析失败");
        }
      } else {
        showMsg("err", "❌ HTTP " + xhr.status + " 错误");
      }
    };

    xhr.onerror = function() {
      bar.style.display = "none";
      btn.disabled = false;
      btn.textContent = "重试";
      showMsg("err", "❌ 网络错误，请检查服务器");
    };

    xhr.send(fd);
  });

  function showMsg(type, html) {
    msg.className = "msg " + type;
    msg.innerHTML = html;
    msg.style.display = "block";
  }
  function hideMsg() {
    msg.style.display = "none";
  }
})();
</script>
</body>
</html>
