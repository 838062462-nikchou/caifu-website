<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>财赋网 · 每日报告</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        .container { max-width: 700px; margin: 40px auto; padding: 24px; }
        h2 { margin-bottom: 24px; color: #1a1a1a; }
        .report-item { padding: 16px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .report-item a { color: #2563eb; text-decoration: none; font-size: 16px; }
        .report-time { color: #666; font-size: 13px; }
        .tip { margin-top: 20px; padding: 12px; background: #f5f7fa; border-radius: 8px; color: #666; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 每日报告列表</h2>
        <div id="report-list">加载中...</div>
        <div class="tip">💡 新报表上传到 reports 文件夹后，刷新页面自动更新列表</div>
    </div>

<script>
const USER = "838062462-nikchou";
const REPO = "caifu-website";
const PATH = "reports";
const BRANCH = "main";

async function loadReports() {
    const listEl = document.getElementById("report-list");
    try {
        const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${PATH}?ref=${BRANCH}`);
        const data = await res.json();
        if (!Array.isArray(data)) {
            listEl.innerHTML = "<p>暂无报表，请先上传文件</p>";
            return;
        }
        // 按时间倒序，最新的在最上面
        data.sort((a,b) => new Date(b.commit.committer.date) - new Date(a.commit.committer.date));
        let html = "";
        data.forEach(item => {
            if (item.type === "file") {
                const fileUrl = `https://${USER}.github.io/${REPO}/${PATH}/${item.name}`;
                const date = new Date(item.commit.committer.date).toLocaleString("zh-CN");
                html += `
                <div class="report-item">
                    <a href="${fileUrl}" target="_blank">${item.name}</a>
                    <span class="report-time">${date}</span>
                </div>`;
            }
        });
        listEl.innerHTML = html || "<p>暂无报表，请先上传文件</p>";
    } catch (e) {
        listEl.innerHTML = "<p>加载失败，请刷新重试</p>";
    }
}
loadReports();
</script>
</body>
</html>
